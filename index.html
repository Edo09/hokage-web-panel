<!doctype html>
<html lang="es" class="dark" data-design="poster">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f141c" />
    <title>The Hokage Coaching — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo: the UI face (Anton, the display face, is bundled — see main.tsx). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5..100,400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint (dark is the default).
      try {
        if (localStorage.getItem('hokage:theme') === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
