<!doctype html>
<html lang="es" class="dark" data-design="poster">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Hokage Coaching — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme + design before first paint (dark / poster are
      // the defaults; 'legacy' is the deprecated original look).
      try {
        if (localStorage.getItem('hokage:theme') === 'light') {
          document.documentElement.classList.remove('dark');
        }
        if (localStorage.getItem('hokage:design') === 'legacy') {
          document.documentElement.dataset.design = 'legacy';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
